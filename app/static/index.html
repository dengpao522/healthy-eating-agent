<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康饮食助手</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>健康饮食助手</h2>
            </div>
            <button class="new-chat-btn" id="newChatBtn">+ 新建对话</button>
            <div class="chat-history" id="chatHistory">
                <!-- 历史对话列表 -->
            </div>
            <div class="sidebar-footer">
                <button class="clear-btn" id="clearBtn">清空当前对话</button>
            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main class="chat-main">
            <div class="chat-header">
                <h3>饮食营养分析</h3>
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">已连接</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon"></div>
                    <h3>你好！我是你的健康饮食助手</h3>
                    <p>上传你的饭菜照片，我会帮你分析营养成分，并给出运动建议。</p>
                    <div class="quick-actions">
                        <button class="quick-btn" data-text="帮我分析这份午餐的营养">分析午餐营养</button>
                        <button class="quick-btn" data-text="我吃了红烧肉和米饭，帮我算算热量">计算红烧肉热量</button>
                        <button class="quick-btn" data-text="今天吃了沙拉，需要运动多久消耗？">沙拉运动建议</button>
                    </div>
                </div>
            </div>

            <!-- 图片预览区域 -->
            <div class="image-preview" id="imagePreview" style="display: none;">
                <div class="preview-container">
                    <img id="previewImg" src="" alt="预览">
                    <button class="remove-img" id="removeImg">&times;</button>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="upload-btn" id="uploadBtn" title="上传图片">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <textarea id="messageInput" placeholder="输入消息，或上传饭菜照片..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" title="发送">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
